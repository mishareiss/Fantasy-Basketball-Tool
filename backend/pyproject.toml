[project]
name = "fbb-backend"
version = "0.1.0"
description = "Backend for the fantasy basketball dynasty tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "espn-api>=0.46.0",
    "nba-api>=1.11.4",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Anything that talks to a real external API is deselected by default, so `make test` is
# offline, deterministic, and needs neither cookies nor a network.
addopts = "-m 'not live and not nbaapi'"
markers = [
    "live: hits the real ESPN API; requires ESPN_S2/SWID in .env",
    "nbaapi: hits the real nba.com stats API; no credentials, but undocumented rate limits",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to sit in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
