# Render Blueprint: the backend only, on the free tier.
#
# The frontend is NOT here — it is a Next.js app on Vercel, with Root Directory `frontend` and
# NEXT_PUBLIC_API_BASE_URL pointed at the web service below. The walk-through is docs/DEPLOY.md.
#
# NO VALUES, ONLY KEYS. Every secret below is `sync: false`: Render asks for it in the dashboard
# and never reads it from git.
#
# The database is a Neon project (its POOLED connection string is DATABASE_URL below), not a
# Render database — Render's free Postgres expires after a month.
#
# FREE-TIER NOTES:
#   * No `preDeployCommand` on free services, so the migration runs in the start command instead
#     (`alembic upgrade head && uvicorn ...`). It is idempotent — a no-op when already at head —
#     and the free plan runs a single instance, so there is no migration race to worry about.
#   * Render cron jobs are not free, so the nightly ESPN sync is NOT declared here. Refresh the
#     data by pointing your local `.env` DATABASE_URL at Neon and running `make sync`
#     (`make sync-ages`), or POST /sync/league + /sync/ages with the Bearer token. See DEPLOY.md.

services:
  - type: web
    name: fbb-backend
    runtime: docker
    # Context `./backend`, so the image never sees the frontend (see backend/Dockerfile).
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    branch: main
    # Migrate, then serve. `alembic` and `alembic.ini` are in the image (backend/Dockerfile),
    # alembic is a runtime dependency, and `upgrade head` is idempotent.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    # Unauthenticated by design (app/auth.py: OPEN_PATHS), so this poll works with the gate on.
    healthCheckPath: /health
    envVars:
      # Neon's POOLED connection string, with the driver prefix and sslmode psycopg needs:
      #   postgresql+psycopg://USER:PASSWORD@ep-xxx-pooler.REGION.aws.neon.tech/DB?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The shared password. Invent a long random ASCII string (`openssl rand -hex 24`). Leave it
      # unset and the gate is OFF — correct locally, wrong here.
      - key: APP_ACCESS_TOKEN
        sync: false
      # The Vercel origin(s), comma-separated. Scheme and host only, no trailing slash. You will
      # not know this until Vercel has deployed once; set it then (DEPLOY.md step 3).
      - key: CORS_ORIGINS
        sync: false
      # ESPN league access — the two cookies plus league and season. They expire ~yearly.
      - key: ESPN_S2
        sync: false
      - key: SWID
        sync: false
      - key: ESPN_LEAGUE_ID
        sync: false
      - key: ESPN_SEASON
        sync: false
      # Optional data providers — nothing reads these yet; leave blank.
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: THE_ODDS_API_KEY
        sync: false
